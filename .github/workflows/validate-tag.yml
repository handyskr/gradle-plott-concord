name: Validate release tag

on:
  push:
    tags:
      - "**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate tag and resolve version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(bash .github/scripts/resolve-version.sh "$RELEASE_TAG")"
          echo "Resolved plugin version: $version"
