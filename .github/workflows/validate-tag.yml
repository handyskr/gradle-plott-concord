name: Validate release tag

on:
  push:
    tags:
      - "**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate tag and resolve version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(bash .github/scripts/resolve-version.sh "$RELEASE_TAG")"
          echo "Resolved plugin version: $version"
