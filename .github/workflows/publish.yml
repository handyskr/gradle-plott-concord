name: Publish to Gradle Plugin Portal

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: gradle-plugin-portal-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: gradle-plugin-portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - id: version
        name: Validate tag and resolve version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(bash .github/scripts/resolve-version.sh "$RELEASE_TAG")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check plugin
        run: ./gradlew -p plugin check
      - name: Publish plugin
        env:
          ORG_GRADLE_PROJECT_pluginVersion: ${{ steps.version.outputs.version }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew -p plugin publishPlugins
