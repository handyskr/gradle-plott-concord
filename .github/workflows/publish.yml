name: Publish to Gradle Plugin Portal

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag in vMAJOR.MINOR.PATCH format
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - id: version
        name: Validate tag and resolve version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          version="$(bash .github/scripts/resolve-version.sh "$RELEASE_TAG")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check plugin
        run: ./gradlew -p plugin check
      - name: Publish plugin
        env:
          ORG_GRADLE_PROJECT_pluginVersion: ${{ steps.version.outputs.version }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew -p plugin publishPlugins
